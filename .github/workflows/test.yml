name: Test dspi-config
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reject generated files and private keys in source
        run: python3 tools/check-repository-hygiene.py
      - name: Check delivery policy
        run: python3 tools/check-delivery-policy.py
      - name: Check shell syntax and package behavior
        run: |
          bash -n bin/dspi-config packaging/build-deb.sh tests/*.sh
          bash tests/test.sh
